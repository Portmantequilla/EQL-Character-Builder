name: DCO

# Every commit in a pull request must carry a Signed-off-by line.
# See CONTRIBUTING.md — use `git commit -s`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format='%s' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Missing Signed-off-by: ${sha:0:8} $subject"
              missing=1
            fi
          done < <(git rev-list "$base".."$head")

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Every commit needs a sign-off. To fix the most recent commit:"
            echo "    git commit --amend -s && git push --force-with-lease"
            echo "For several commits:"
            echo "    git rebase --signoff $base && git push --force-with-lease"
            exit 1
          fi
          echo "All commits signed off."
